[appearance]
font_family = "JetBrains Mono, monospace"
font_size = 13
sidebar_width = 280
repo_sidebar_width = 220
dark = true

[colors]
bg        = "#0b0b0c"
surface   = "#121214"
surface_2 = "#17171a"
border    = "#242428"
text      = "#e8e8ea"
text_dim  = "#8b8b93"
accent    = "#7aa2f7"
added     = "#73daca"
removed   = "#f7768e"
modified  = "#e0af68"
selection = "#1d2a44"

[behavior]
max_commits = 200
auto_refresh = true
refresh_interval_sec = 4
scan_parent_on_start = true

[repos]
paths = ["."]
